name: Lab 05 - Job Dependencies and Outputs

on:
  workflow_dispatch:

jobs:
  build:
    name: Generate Build Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.generate_version.outputs.version }}

    steps:
      - name: Generate build version
        id: generate_version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    name: Read Build Version
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Display version for testing
        run: echo "Testing build version ${{ needs.build.outputs.version }}"
